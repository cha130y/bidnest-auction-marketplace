name: CI
on:
  pull_request:
    branches: [main, dev]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      # apps/api/generated/prisma is gitignored, so a fresh checkout has no
      # client. Without it the type-aware eslint rules resolve every Prisma
      # call to `error` and lint fails.
      - run: pnpm --filter api exec prisma generate
      - run: pnpm lint
      - run: pnpm test
